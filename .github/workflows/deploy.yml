name: Deploy Hexo site to main (GitHub Pages)

# 推送 source 分支（源码/posts）时，自动构建站点并更新 main 分支，
# GitHub Pages 从 main 分支提供服务。
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npx hexo generate

      - name: Deploy generated site to main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          rm -rf /tmp/gh-pages
          git worktree add /tmp/gh-pages main 2>/dev/null || git worktree add /tmp/gh-pages -b main
          rsync -a --delete --exclude='.git' public/ /tmp/gh-pages/
          touch /tmp/gh-pages/.nojekyll
          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes; nothing to deploy."
          else
            git commit -m "deploy: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
            echo "Pushed updated site to main."
          fi
